map $http_x_forwarded_proto $fastcgi_https {
    default off;
    https on;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    server_tokens off;
    client_max_body_size 112m;

    # Only the host reverse proxy can reach the loopback-published port.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;

    error_page 413 = @upload_too_large;
    location @upload_too_large {
        default_type application/json;
        return 413 '{"message":"Video size exceeded. Maximum 100 MB. / Объём видео превышен. Максимум 100 МБ.","code":"upload_too_large"}';
    }

    location ^~ /storage/ {
        rewrite ^ /index.php last;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_read_timeout 180s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
