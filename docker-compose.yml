services:
  app:
    image: karaterating-v2-app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: karaterating_v2_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/kr-uploads.ini:ro
    depends_on:
      - mysql

  panel-worker:
    image: karaterating-v2-app
    working_dir: /var/www/html
    command: php -d memory_limit=512M artisan queue:work panel_tasks --queue=panel_tasks --sleep=1 --tries=1 --timeout=600 --memory=512 --max-jobs=20
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql

  scheduler:
    image: karaterating-v2-app
    working_dir: /var/www/html
    command: php artisan schedule:work
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/kr-uploads.ini:ro
    depends_on:
      - mysql
    profiles: ["background"]

  nginx:
    image: nginx:1.27-alpine
    container_name: karaterating_v2_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: karaterating_v2_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: karate_production
      MYSQL_USER: karate
      MYSQL_PASSWORD: karate
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./storage/app/db-dumps/local-karaterating-current.sql:/docker-entrypoint-initdb.d/01-karate-production.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:
